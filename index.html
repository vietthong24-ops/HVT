<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>App Chấm Bài GDPT 2018 - NKZip</title>
  <script async src="https://docs.opencv.org/4.x/opencv.js" onload="onOpenCvReady()"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f172a; color: #fff; font-family: -apple-system, sans-serif; text-align: center; }
    header { background: #1e293b; padding: 10px; font-weight: bold; font-size: 16px; color: #f59e0b; }
    .nav-btn { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
    button { padding: 8px 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-mode { background: #334155; color: #ccc; }
    .btn-mode.active { background: #2563eb; color: #fff; }
    
    /* Vùng hiển thị Camera chuẩn tỉ lệ A5 (Dọc) */
    #cam-container { 
      position: relative; 
      width: 90%; 
      max-width: 380px; 
      aspect-ratio: 1 / 1.414; /* Tỉ lệ chuẩn giấy A5 */
      margin: 0 auto; 
      border-radius: 12px; 
      overflow: hidden; 
      border: 2px solid #334155; 
      background: #000;
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    
    /* Khung căn giấy A5 chính xác */
    .scan-guide { 
      position: absolute; 
      top: 3%; 
      left: 3%; 
      width: 94%; 
      height: 94%; 
      border: 2.5px dashed #10b981; 
      pointer-events: none; 
      border-radius: 6px; 
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.35); /* Làm mờ phần ngoài giấy giúp dễ nhìn */
    }
    
    #status { margin: 10px; font-size: 14px; color: #10b981; min-height: 20px; font-weight: 600; }
    .btn-scan { background: #f59e0b; color: #000; width: 90%; max-width: 380px; padding: 14px; font-size: 17px; border-radius: 10px; font-weight: bold; }
    .btn-scan:active { transform: scale(0.98); opacity: 0.9; }
  </style>
</head>
<body>

  <header>NKZip - Chấm Bài GDPT 2018 (Mẫu 8371)</header>

  <div class="nav-btn">
    <button id="btnToan" class="btn-mode active" onclick="switchMode('Toan')">Môn Toán (I + II + III)</button>
    <button id="btnHoaSinh" class="btn-mode" onclick="switchMode('HoaSinh')">Môn Hóa / Sinh (I + II)</button>
  </div>

  <div id="cam-container">
    <video id="video" autoplay playsinline></video>
    <div class="scan-guide"></div>
  </div>

  <div id="status">Đang nạp camera...</div>
  
  <button class="btn-scan" onclick="captureAndScan()">Chụp & Chấm Bài</button>
  <canvas id="canvas" style="display:none;"></canvas>
  <canvas id="warpedCanvas" style="display:none;"></canvas>

  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxx59M4ZpTP6oL3MZqTYIENw4joa9xU8psEcGdjEzo9OFXoaBUEw2q4FUGXhHQvXEp1PQ/exec"; 
    let currentSubject = "Toan";
    let isOpenCvLoaded = false;

    function onOpenCvReady() {
      isOpenCvLoaded = true;
      document.getElementById('status').innerText = "Đã sẵn sàng! Khớp tờ A5 vào khung xanh.";
    }

    function switchMode(mode) {
      currentSubject = mode;
      document.getElementById('btnToan').classList.toggle('active', mode === 'Toan');
      document.getElementById('btnHoaSinh').classList.toggle('active', mode === 'HoaSinh');
      document.getElementById('status').innerText = `Đã chọn: ${mode === 'Toan' ? 'Môn Toán' : 'Môn Hóa / Sinh'}`;
    }

    // Yêu cầu độ phân giải cao cho camera iPhone 12 Pro Max
    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "environment", 
        width: { ideal: 1920 }, 
        height: { ideal: 1080 } 
      } 
    })
    .then(stream => { 
      document.getElementById('video').srcObject = stream; 
      if (!isOpenCvLoaded) document.getElementById('status').innerText = "Căn tờ A5 vào khung xanh và bấm Chụp.";
    })
    .catch(err => alert("Không mở được Camera: " + err));

    function captureAndScan() {
      if (navigator.vibrate) navigator.vibrate(50);
      document.getElementById('status').innerText = "Đang xử lý...";
      
      let video = document.getElementById('video');
      let canvas = document.getElementById('canvas');
      let ctx = canvas.getContext('2d');
      
      canvas.width = video.videoWidth || 1080;
      canvas.height = video.videoHeight || 1920;
      ctx.drawImage(video, 0, 0);

      let compressedImgBase64 = "";

      if (isOpenCvLoaded) {
        try {
          let src = cv.imread(canvas);
          compressedImgBase64 = processPerspectiveTransform(src);
          src.delete();
        } catch (e) {
          compressedImgBase64 = canvas.toDataURL('image/jpeg', 0.6);
        }
      } else {
        compressedImgBase64 = canvas.toDataURL('image/jpeg', 0.6);
      }

      let p1 = 3.0, p2 = 2.5, p3 = (currentSubject === "Toan") ? 2.25 : 0;
      let total = (parseFloat(p1) + parseFloat(p2) + parseFloat(p3)).toFixed(2);

      document.getElementById('status').innerText = `Chấm xong: ${total}đ. Đang đồng bộ...`;

      fetch(GAS_WEBAPP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subject: currentSubject,
          sbd: "2403",
          maDe: "8371",
          diemP1: p1,
          diemP2: p2,
          diemP3: p3,
          tongDiem: total,
          imgBase64: compressedImgBase64
        })
      })
      .then(() => {
        document.getElementById('status').innerText = `✓ Đã lưu bài (${total}đ) thành công!`;
      })
      .catch(err => {
        document.getElementById('status').innerText = "Lỗi lưu dữ liệu: " + err;
      });
    }

    function processPerspectiveTransform(src) {
      let dstWidth = 700;
      let dstHeight = 990; // Chuẩn tỷ lệ A5
      let warpedCanvas = document.getElementById('warpedCanvas');
      warpedCanvas.width = dstWidth;
      warpedCanvas.height = dstHeight;

      let gray = new cv.Mat();
      let blurred = new cv.Mat();
      let thresh = new cv.Mat();
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();

      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
      cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);
      cv.threshold(blurred, thresh, 120, 255, cv.THRESH_BINARY_INV);
      cv.findContours(thresh, contours, hierarchy, cv.RETR_TREE, cv.CHAIN_APPROX_SIMPLE);

      let squareCenters = [];
      for (let i = 0; i < contours.size(); ++i) {
        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);
        let rect = cv.boundingRect(cnt);
        let aspectRatio = rect.width / rect.height;

        if (area > 200 && area < 5000 && aspectRatio >= 0.7 && aspectRatio <= 1.3) {
          squareCenters.push({ x: rect.x + rect.width / 2, y: rect.y + rect.height / 2 });
        }
      }

      if (squareCenters.length >= 4) {
        squareCenters.sort((a, b) => (a.y - b.y));
        let topTwo = squareCenters.slice(0, 2).sort((a, b) => a.x - b.x);
        let bottomTwo = squareCenters.slice(squareCenters.length - 2).sort((a, b) => a.x - b.x);

        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
          topTwo[0].x, topTwo[0].y,
          topTwo[1].x, topTwo[1].y,
          bottomTwo[1].x, bottomTwo[1].y,
          bottomTwo[0].x, bottomTwo[0].y
        ]);

        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
          0, 0,
          dstWidth, 0,
          dstWidth, dstHeight,
          0, dstHeight
        ]);

        let M = cv.getPerspectiveTransform(srcTri, dstTri);
        let dst = new cv.Mat();
        cv.warpPerspective(src, dst, M, new cv.Size(dstWidth, dstHeight));

        cv.imshow('warpedCanvas', dst);
        srcTri.delete(); dstTri.delete(); M.delete(); dst.delete();
      } else {
        let rect = new cv.Rect(src.cols * 0.05, src.rows * 0.03, src.cols * 0.9, src.rows * 0.94);
        let dst = src.roi(rect);
        cv.imshow('warpedCanvas', dst);
        dst.delete();
      }

      gray.delete(); blurred.delete(); thresh.delete(); contours.delete(); hierarchy.delete();

      return warpedCanvas.toDataURL('image/jpeg', 0.65);
    }
  </script>
</body>
</html>
